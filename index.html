async function authReq(path, body, token){
  const r = await fetch(`${API}/auth/v1/${path}`,{method:'POST',
    headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},
    body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description || j.msg || j.message || ('Error '+r.status));
  return j;
}
const normSession = j => ({access_token:j.access_token, refresh_token:j.refresh_token,
  expires_at: j.expires_at || Math.floor(Date.now()/1000)+(j.expires_in||3600),
  user:{id:j.user.id, email:j.user.email}});

let refreshing = null;
async function validToken(force){
  if(!session) throw new Error('nosession');
  if(force || session.expires_at - Date.now()/1000 < 90){
    refreshing ??= authReq('token?grant_type=refresh_token',{refresh_token:session.refresh_token})
      .then(j=>setSession(normSession(j)))
      .catch(e=>{ if(/refresh token|invalid|not found|revoked/i.test(e.message)) throw new Error('nosession'); throw e; })
      .finally(()=>{ refreshing=null; });
    await refreshing;
  }
  return session.access_token;
}
async function db(method, query, body, opt={}){
  for(let i=0;i<2;i++){
    const tok = await validToken(i>0);
    const r = await fetch(`${API}/rest/v1/rutinas${query}`,{method, keepalive:!!opt.keepalive,
      headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json',...(opt.headers||{})},
      body: body ? JSON.stringify(body) : undefined});
    if(r.status===401 && i===0) continue;
    if(!r.ok){ const j=await r.json().catch(()=>({})); throw new Error(j.message || ('Error '+r.status)); }
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }
}

const cloudSave = keepalive => db('POST','',{user_id:session.user.id, data:state, updated_at:new Date().toISOString()},

let saveTimer=null, dirty=false, saving=false;
function save(){
  writeCache();
  if(!CLOUD || !session) return;
  dirty = true; try{ localStorage.setItem(pendKey(),'1'); }catch(e){}
  setSync('wait');
  clearTimeout(saveTimer); saveTimer = setTimeout(flush,1200);
}
async function flush(keepalive){
  clearTimeout(saveTimer);
  if(!session || !dirty) return;
  if(saving){ saveTimer=setTimeout(flush,800); return; }
  saving = true; dirty = false; setSync('wait');
  let failed = false;
  try{ await cloudSave(keepalive===true); }
  catch(e){
    dirty = true; failed = true;
    if(e.message==='nosession'){ saving=false; return onAuthLost(); }
    setSync('err'); saveTimer = setTimeout(flush,10000);
  }
  saving = false;
  if(failed) return;
  if(dirty) saveTimer = setTimeout(flush,800);
  else { try{ localStorage.removeItem(pendKey()); }catch(e){} setSync('ok'); }
}
async function pull(){
  if(!CLOUD || !session || dirty || saving || localStorage.getItem(pendKey())) return;
  try{
    setSync('load');
    const row = await cloudLoad();
    if(row && row.data && !dirty){
      if(JSON.stringify(row.data)!==JSON.stringify(state)){ state=normalize(row.data); clearUndo(); writeCache(); render(); }
    }
    setSync('ok');
  }catch(e){ if(e.message==='nosession') onAuthLost(); else setSync('err'); }
}

async function enterApp(){
  hideAuth(); updateUser(); clearUndo();
  const cached = loadLocal(cacheKey());
  state = cached;
  if(state) render(); else showMsgScreen('🔄 Cargando tu rutina…');
  setSync('load');
  try{
    if(cached && localStorage.getItem(pendKey())){ dirty=true; await flush(); return; }
    const row = await cloudLoad();
    if(row && normalize(row.data)){
      state = normalize(row.data); writeCache(); render(); setSync('ok');
    } else {
      state = cached || loadLocal(KEY) || loadLocal('rutina-gym-v1') || defaults();
      render(); save(); await flush();
    }
  }catch(e){
    if(e.message==='nosession') return onAuthLost();
    setSync('err');
    if(!state) showMsgScreen('⚠️ No se pudo cargar tu rutina. Revisá tu conexión.', true);
  }
}
function onAuthLost(){ setSession(null); state=null; clearUndo(); updateUser(); showAuth('Tu sesión expiró. Ingresá de nuevo.','err'); }

  authReq('logout',{},tok).catch(()=>{});
  clearTimeout(saveTimer); dirty=false;

}

/* ---------- Series ---------- */
// Devuelve las series de un ejercicio en una semana (sin modificar el estado).
// Si la semana se cargó con el formato viejo (un peso + reps), las arma a partir de eso.
function getSets(e,w){
  const l = getLog(e.id,w);
  if(Array.isArray(l.s)) return l.s;
  const n = Math.max(1, Math.round(num(e.series)||3));
  const rs = String(l.r ?? '').split(',').map(x=>x.trim()).filter(Boolean);
  const has = !!(l.p || l.r);
  if(rs.length > 1) return rs.map(r=>({p:String(l.p ?? ''), r, d:true}));
  return Array.from({length:n},()=>({p:has?String(l.p ?? ''):'', r:has?(rs[0]||''):'', d:has}));
}
// Crea las series en el estado para poder editarlas
function materialize(e,w){
  state.log[e.id] ??= {}; state.log[e.id][w] ??= {p:'',r:''};
  const l = state.log[e.id][w];
  if(!Array.isArray(l.s)) l.s = getSets(e,w).map(x=>({...x}));
  return l.s;
}
// Actualiza el resumen (peso de la serie más pesada + reps por serie) que usan Seguimiento, Progreso y Excel
function summarize(id,w){
  const l = state.log[id][w], s = l.s || [];
  const ws = s.map(x=>num(x.p)).filter(v=>v!=null);
  l.p = ws.length ? String(Math.max(...ws)) : '';
  l.r = s.map(x=>String(x.r ?? '').trim()).filter(Boolean).join(',');
}
function hasData(id,w){
  const l = getLog(id,w);
  return !!(l.p || l.r || (Array.isArray(l.s) && l.s.some(x=>x.p!=='' || x.r!=='')));
}
const setsTxt = (e,w) => getSets(e,w).filter(x=>x.p!=='' || x.r!=='').map(x=>`${x.p||'—'}×${x.r||'—'}`).join(' · ');
// Sugerencia para una serie: peso de la serie anterior de hoy (o de la semana pasada) y reps de la semana pasada
function sugOf(e,w,sets,i){
  const prev = w>1 && hasData(e.id,w-1) ? getSets(e,w-1) : null;
  const pp = prev ? (prev[i] || prev[prev.length-1]) : null;
  let p = '';
  for(let j=i-1;j>=0;j--){ if(sets[j].p!==''){ p = sets[j].p; break; } }
  if(p==='' && pp) p = pp.p || '';
  return {p:String(p), r:String(pp ? (pp.r || '') : '')};
}

function oneRM(p,rStr){
  const r = Math.max(0,...repsList(rStr)); if(!p || !r) return null;
  return r===1 ? p : p*(1+r/30); // Epley
}
function rmOf(id,w){
  const l = getLog(id,w);
  if(Array.isArray(l.s)){
    let b = null;
    l.s.forEach(x=>{ const v = oneRM(num(x.p), x.r); if(v!=null && (b==null || v>b)) b = v; });
    return b;
  }
  return oneRM(num(l.p), l.r);
}
function bestRM(id){ let b=null; for(let w=1;w<=state.weeks;w++){ const v=rmOf(id,w); if(v!=null&&(b==null||v>b)) b=v; } return b; }
function volEx(e,w){
  const l = getLog(e.id,w);
  if(Array.isArray(l.s)) return l.s.reduce((a,x)=>{ const p=num(x.p), r=repsList(x.r)[0]; return a + (p!=null && r ? p*r : 0); },0);
  const p = num(l.p); if(p==null) return 0;
  const rs = repsList(l.r); if(!rs.length) return 0;
  return rs.length>1 ? p*rs.reduce((a,b)=>a+b,0) : p*rs[0]*(num(e.series)||1);
}

  const nTo = mv.to ? byDay(mv.to).length : 0;
  $('mvSwapWrap').style.display = mv.to && nTo ? '' : 'none';
  if(!(mv.to && nTo)) $('mvSwap').checked = false;
  $('mvSwapDay').textContent = mv.to || '';
  $('mvSwapFrom').textContent = mv.from;
  const n = mv.sel.size;
  let sum;
  if(!n) sum = 'Elegí al menos un ejercicio.';
  else if(!mv.to) sum = 'Elegí el día de destino.';
  else {
    sum = `Vas a mover <b>${n}</b> ejercicio${n>1?'s':''} del <b>${mv.from}</b> al <b>${mv.to}</b>`;
    if($('mvSwap').checked && nTo) sum += ` y <b>${nTo}</b> del ${mv.to} al ${mv.from}`;
    sum += '. Tus pesos registrados se mantienen.';
  }
  $('mvSummary').innerHTML = sum;
  $('mvGo').disabled = !n || !mv.to;
  $('mvGo').textContent = n && mv.to ? `Mover ${n} al ${mv.to}` : 'Mover';
}
$('mvFrom').onclick = e => {
  const b = e.target.closest('[data-d]'); if(!b || b.disabled) return;
  mv.from = b.dataset.d; if(mv.to===mv.from) mv.to = null;
  mv.sel = new Set(byDay(mv.from).map(x=>x.id)); renderMove();
};
$('mvTo').onclick = e => { const b = e.target.closest('[data-d]'); if(!b || b.disabled) return; mv.to = b.dataset.d; renderMove(); };
$('mvGroups').onclick = e => {
  const b = e.target.closest('[data-g]'); if(!b) return;
  const g = b.dataset.g;
  mv.sel = new Set(byDay(mv.from).filter(x=>g==='*' || grp(x)===g).map(x=>x.id)); renderMove();
};
$('mvList').onchange = e => {
  const id = e.target.dataset.mid; if(!id) return;
  e.target.checked ? mv.sel.add(id) : mv.sel.delete(id); renderMove();
};
$('mvSwap').onchange = renderMove;
$('mvClose').onclick = closeMove;
$('mvCancel').onclick = closeMove;
$('mvModal').addEventListener('mousedown', e => { if(e.target.id==='mvModal') closeMove(); });
$('mvGo').onclick = () => {
  if(!mv.sel.size || !mv.to) return;
  const from = mv.from, to = mv.to, swap = $('mvSwap').checked;
  snapshot(`Mover ejercicios ${from} → ${to}`);
  const moving = state.exercises.filter(e=>mv.sel.has(e.id));
  const back = swap ? state.exercises.filter(e=>e.dia===to) : [];
  moving.forEach(e=>e.dia = to);
  back.forEach(e=>e.dia = from);
  // los ejercicios movidos quedan al final de su nuevo día
  state.exercises = state.exercises.filter(e=>!moving.includes(e) && !back.includes(e)).concat(back, moving);
  if(view==='entrenar') entDia = to;
  save(); closeMove(); render();
  toast(swap && back.length ? `⇄ ${from} y ${to} intercambiados` : `📅 ${moving.length} ejercicio${moving.length>1?'s':''} al ${to}`, true);
};

document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if(!$('addModal').classList.contains('hidden')){ closeAdd(); return; }
    if(!$('mvModal').classList.contains('hidden')){ closeMove(); return; }
  }
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==='z'){
    if(e.target.matches('input,textarea,select') || !state || anyModal()) return;
    e.preventDefault(); undo();
  }
});

    options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}

function vEntrenar(){
  const days = activeDays();
  if(!days.length) return `<div class="card empty">No hay ejercicios en tu rutina.<br><br><button class="btn primary" data-action="add-ex">+ Agregar ejercicio</button></div>`;
  if(!days.includes(entDia)) entDia = days[0];
  const w = state.curWeek;
  let tot = 0, dn = 0;
  const cards = byDay(entDia).map(e=>{
    const sets = getSets(e,w), done = sets.filter(x=>x.d).length, rm = rmOf(e.id,w);
    tot += sets.length; dn += done;
    const prevTxt = w>1 && hasData(e.id,w-1) ? `Semana anterior: <b>${esc(setsTxt(e,w-1))}</b>` : 'Sin registro de la semana anterior';
    const rows = sets.map((s,i)=>{
      const sg = sugOf(e,w,sets,i);
      return `<div class="setrow ${s.d?'done':''}">
        <span class="setn">${i+1}</span>
        <input data-sp="${i}" value="${esc(s.p)}" placeholder="${esc(sg.p||'kg')}" inputmode="decimal">
        <input data-sr="${i}" value="${esc(s.r)}" placeholder="${esc(sg.r||'reps')}" inputmode="numeric">
        <button class="chk" data-action="set-done" data-i="${i}" title="${s.d?'Desmarcar serie':'Marcar serie como hecha'}">✓</button>
      </div>`;
    }).join('');
    const desc = num(e.descanso) || 60;
    return `<div class="excard ${done===sets.length?'complete':''}" data-id="${e.id}" data-wk="${w}">
      <div class="exhead"><div><b>${esc(e.nombre)||'(sin nombre)'}</b><small>${esc(e.grupo)}</small></div>
        <div><span class="badge">${esc(e.series)} × ${esc(e.reps)}</span><div class="sdone">${done===sets.length?'✔ ':''}${done}/${sets.length} series</div></div></div>
      <div class="meta"><span>⏱ ${esc(e.descanso)}s descanso</span><span>🎯 RPE ${esc(e.rpe)}</span><span>🐢 Tempo ${esc(e.tempo)}</span></div>
      ${e.notas?`<div class="note">📝 ${esc(e.notas)}</div>`:''}
      <div class="prev">${prevTxt}</div>
      <div class="setlist">
        <div class="sethead"><span>#</span><span>Peso (kg)</span><span>Reps</span><span></span></div>
        ${rows}
      </div>
      <div class="row between">
        <div class="row" style="gap:6px">
          <button class="btn sm" data-action="set-add">+ Serie</button>
          <button class="btn sm" data-action="set-del" ${sets.length<=1?'disabled':''}>− Serie</button>
          <button class="btn sm" data-action="timer" data-sec="${desc}" data-name="${esc(e.nombre)}">⏱ ${desc}s</button>
        </div>
        <div class="rm">1RM est.<b data-rm>${rm?fmt(rm)+' kg':'—'}</b></div>
      </div>
    </div>`;
  }).join('');
  const pct = tot ? Math.round(dn/tot*100) : 0;
  return `<div class="row between" style="margin-bottom:14px">
      <div class="chips">${days.map(d=>`<button class="chip ${d===entDia?'active':''}" data-action="dia" data-dia="${d}">${d}${d===HOY?' · hoy':''}</button>`).join('')}
        <button class="chip add" data-action="add-ex">+ Agregar</button>
        <button class="chip add" data-action="move" data-dia="${entDia}">📅 Mover</button></div>
      ${weekPicker()}
    </div>
    <div class="card" style="padding:12px 16px;margin-bottom:14px">
      <div class="row between"><span class="mut" style="font-size:13px">Progreso del ${entDia} · semana ${w}</span><b style="font-size:13px">${dn}/${tot} series ${dn===tot&&tot?'🎉':''}</b></div>
      <div class="pbar"><div style="width:${pct}%"></div></div>
    </div>
    <div class="grid g2">${cards}</div>
    <p class="hint">💡 Tocá ✓ al terminar cada serie: si dejaste un campo vacío se completa con el valor sugerido (el gris) y arranca el descanso. Los valores grises vienen de tu serie anterior o de la semana pasada.</p>`;
}
function refreshCard(card,e,w){
  const sets = getSets(e,w);
  card.querySelectorAll('.setrow').forEach((row,i)=>{
    if(!sets[i]) return;
    const sg = sugOf(e,w,sets,i);
    row.querySelector('[data-sp]').placeholder = sg.p || 'kg';
    row.querySelector('[data-sr]').placeholder = sg.r || 'reps';
  });
  const rm = rmOf(e.id,w), rmEl = card.querySelector('[data-rm]');
  if(rmEl) rmEl.textContent = rm ? fmt(rm)+' kg' : '—';
}

}

function vSeguimiento(){
  let head=`<th class="sticky">Ejercicio</th><th>Series × Reps</th>`;
  for(let w=1;w<=state.weeks;w++) head+=`<th class="wk ${w===state.curWeek?'cur':''}">Semana ${w}<br><span style="font-weight:400;text-transform:none">kg · reps</span></th>`;
  const rows = groupedRows(state.weeks+2, sorted(), e=>{
    let cells=''; for(let w=1;w<=state.weeks;w++){ const l=getLog(e.id,w), ps=Array.isArray(l.s);
      cells+=`<td class="wk ${w===state.curWeek?'cur':''} ${ps?'ps':''}" ${ps?`title="Por serie: ${esc(setsTxt(e,w))}"`:''}><div class="wkcell"><input data-w="${w}" data-k="p" value="${esc(l.p)}" placeholder="kg" inputmode="decimal"><input data-w="${w}" data-k="r" value="${esc(l.r)}" placeholder="reps"></div></td>`; }
    return `<tr data-id="${e.id}"><td class="sticky"><b>${esc(e.nombre)||'(sin nombre)'}</b><br><small class="mut">${esc(e.grupo)}</small></td><td>${esc(e.series)} × ${esc(e.reps)}</td>${cells}</tr>`;
  });
  return `<div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">💡 Las celdas con borde azul se cargaron serie por serie en “Entrenar” (pasá el mouse para ver el detalle). Muestran el peso de tu serie más pesada. Si las editás acá, se reemplaza el detalle por serie.</p>`;
}

function vProgreso(){
  const list = sorted();
  if(!list.length) return `<div class="card empty">No hay ejercicios en tu rutina.<br><br><button class="btn primary" data-action="add-ex">+ Agregar ejercicio</button></div>`;
  if(!progEx || !list.find(e=>e.id===progEx)) progEx = (list.find(e=>weightsOf(e.id).some(v=>v!=null))||list[0]).id;
  let improved=0, best=null;
  const rows = groupedRows(8, list, e=>{
    const vals=weightsOf(e.id).filter(v=>v!=null);
    const ini=vals[0]??null, ult=vals.length?vals[vals.length-1]:null, mx=vals.length?Math.max(...vals):null;
    const dif=(ini!=null&&ult!=null)?ult-ini:null, pct=(dif!=null&&ini)?dif/ini*100:null, rm=bestRM(e.id);
    if(dif>0) improved++;
    if(pct!=null&&(!best||pct>best.pct)) best={n:e.nombre,pct};
    const cls=dif>0?'pos':dif<0?'neg':'';
    return `<tr class="click ${e.id===progEx?'sel':''}" data-action="sel-ex" data-ex="${e.id}"><td><b>${esc(e.nombre)}</b></td>
      <td>${fmt(ini)} kg</td><td>${fmt(ult)} kg</td><td>${fmt(mx)} kg</td>
      <td class="${cls}">${dif==null?'—':(dif>0?'+':'')+fmt(dif)+' kg'}</td>
      <td class="${cls}">${pct==null?'—':(pct>0?'+':'')+fmt(pct)+'%'}</td>
      <td style="color:var(--blue);font-weight:600">${rm?fmt(rm)+' kg':'—'}</td><td>${vals.length}</td></tr>`;
  });
  return `<div class="grid g4" style="margin-bottom:14px">
      <div class="card stat"><small>Ejercicios con progreso</small><b class="pos">${improved}</b></div>
      <div class="card stat"><small>Mayor mejora</small><b style="font-size:17px">${best&&best.pct>0?esc(best.n)+' <span class="pos">+'+fmt(best.pct)+'%</span>':'—'}</b></div>
      <div class="card stat"><small>Volumen semana ${state.curWeek}</small><b>${fmt(volWeek(state.curWeek),0)} kg</b></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="row between" style="margin-bottom:10px"><h3 style="margin:0">Evolución por ejercicio</h3>
        <select id="progSel" style="width:auto;max-width:100%">${list.map(e=>`<option value="${e.id}" ${e.id===progEx?'selected':''}>${esc(e.dia)} · ${esc(e.nombre)}</option>`).join('')}</select>
      </div>
      <div class="chartbox"><canvas id="progChart"></canvas></div>
    </div>
    <div class="tablewrap"><table><thead><tr><th>Ejercicio</th><th>Peso inicial</th><th>Último</th><th>Máximo</th><th>Progreso</th><th>%</th><th>Mejor 1RM est.</th><th>Registros</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p class="hint">💡 Tocá una fila para ver su gráfico. El peso es el de tu serie más pesada de cada semana. 1RM estimado (Epley): peso × (1 + reps/30), usando tu mejor serie.</p>`;
}
function afterProgreso(){
  if(!progEx) return;
  const labels=[],pesos=[],rms=[];
  for(let w=1;w<=state.weeks;w++){ labels.push('S'+w); pesos.push(num(getLog(progEx,w).p)); const r=rmOf(progEx,w); rms.push(r?Math.round(r*10)/10:null); }
  mkChart('progChart',{type:'line',data:{labels,datasets:[
    {label:'Peso máx. (kg)',data:pesos,borderColor:'#22c55e',backgroundColor:'#22c55e33',fill:true,tension:.3,spanGaps:true,pointRadius:4},
    {label:'1RM estimado (kg)',data:rms,borderColor:'#3b82f6',borderDash:[6,4],tension:.3,spanGaps:true,pointRadius:3}
  ]},options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false}}});
}

function vCorporal(){
  const bs=bodySorted(), today=new Date().toISOString().slice(0,10);
  const rows = [...bs].reverse().map((b,i,arr)=>{
    const prev=arr[i+1], d=prev?b.peso-prev.peso:null, cls=d>0?'pos':d<0?'neg':'';
    return `<tr><td>${new Date(b.fecha+'T12:00').toLocaleDateString('es',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</td><td><b>${fmt(b.peso)} kg</b></td>
      <td class="${cls}">${d==null?'—':(d>0?'+':'')+fmt(d)+' kg'}</td><td><button class="btn sm danger" data-action="bw-del" data-bid="${b.id}">✕</button></td></tr>`;
  }).join('');
  const first=bs[0], last=bs[bs.length-1], tot=first&&last&&bs.length>1?last.peso-first.peso:null;
  return `<div class="grid g2">
    <div class="card">
      <h3>Nuevo registro</h3>
      <div class="row" style="flex-wrap:nowrap">
        <input type="date" id="bwDate" value="${today}">
        <input id="bwKg" placeholder="Peso (kg)" inputmode="decimal" style="max-width:130px">
        <button class="btn primary" data-action="bw-add">Agregar</button>
      </div>
      <div class="grid g4" style="margin-top:16px">
        <div class="stat"><small>Actual</small><b>${last?fmt(last.peso)+' kg':'—'}</b></div>
        <div class="stat"><small>Cambio total</small><b class="${tot>0?'pos':tot<0?'neg':''}">${tot==null?'—':(tot>0?'+':'')+fmt(tot)+' kg'}</b></div>
      </div>
    </div>
    <div class="card"><h3>Evolución</h3><div class="chartbox"><canvas id="bwChart"></canvas></div></div>
  </div>
  <div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Fecha</th><th>Peso</th><th>Cambio</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="4" class="empty">Todavía no registraste tu peso corporal.</td></tr>'}</tbody></table></div>`;
}
function afterCorporal(){
  const bs=bodySorted(); if(!bs.length) return;
  mkChart('bwChart',{type:'line',data:{labels:bs.map(b=>new Date(b.fecha+'T12:00').toLocaleDateString('es',{day:'numeric',month:'short'})),
    datasets:[{label:'Peso corporal (kg)',data:bs.map(b=>b.peso),borderColor:'#f59e0b',backgroundColor:'#f59e0b33',fill:true,tension:.3,pointRadius:4}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false}}}});
}

const RENDER = {inicio:[vInicio,afterInicio],entrenar:[vEntrenar],rutina:[vRutina],seguimiento:[vSeguimiento],progreso:[vProgreso,afterProgreso],corporal:[vCorporal,afterCorporal]};
function setHeader(){
  $('title').textContent = VIEWS[view].ic+' '+VIEWS[view].t;
  $('subtitle').textContent = VIEWS[view].s;
}
function render(){
  if(!state) return;
  charts.forEach(c=>c.destroy()); charts=[];
  renderNav(); setHeader();
  const [v,after] = RENDER[view];
  $('main').innerHTML = v();
  if(after) after();
}
function showMsgScreen(txt, retry){
  charts.forEach(c=>c.destroy()); charts=[];
  renderNav(); setHeader();
  $('main').innerHTML = `<div class="card empty">${txt}${retry?'<br><br><button class="btn primary" data-action="retry">Reintentar</button>':''}</div>`;
}

/* =================== EVENTOS =================== */
const main = $('main');
const isEditField = el => !!(el.dataset.f || el.dataset.w || el.dataset.sp!=null || el.dataset.sr!=null);
// Foto del estado antes de editar un campo (para poder deshacer la edición)
main.addEventListener('focusin', e=>{ if(state && isEditField(e.target)) editSnap = JSON.stringify(state); });
main.addEventListener('input', e=>{
  const el=e.target, holder=el.closest('[data-id]'); if(!holder || !state) return;
  const id=holder.dataset.id;
  if(el.dataset.f){ const ex=state.exercises.find(x=>x.id===id); if(ex) ex[el.dataset.f]=el.value; save(); }
  else if(el.dataset.w){
    const w=+el.dataset.w, lg=state.log[id]?.[w];
    if(lg && Array.isArray(lg.s)){ delete lg.s; holder.querySelectorAll(`td.ps`).forEach(td=>{ if(td.contains(el)) td.classList.remove('ps'); }); }
    setLog(id,w,el.dataset.k,el.value); save();
  }
  else if(el.dataset.sp!=null || el.dataset.sr!=null){
    const w=+holder.dataset.wk, ex=state.exercises.find(x=>x.id===id); if(!ex) return;
    const isP = el.dataset.sp!=null, i=+(isP ? el.dataset.sp : el.dataset.sr);
    const sets = materialize(ex,w); if(!sets[i]) return;
    sets[i][isP?'p':'r'] = el.value;
    summarize(id,w); save(); refreshCard(holder,ex,w);
  }
});
main.addEventListener('change', e=>{
  const el=e.target;
  if(state && editSnap && isEditField(el)){
    const now = JSON.stringify(state);
    if(now !== editSnap){
      const id = el.closest('[data-id]')?.dataset.id, n = exName(id);
      const label = el.dataset.f==='dia' ? `Cambio de día de ${n}`
        : el.dataset.w ? `Registro S${el.dataset.w} de ${n}`
        : (el.dataset.sp!=null || el.dataset.sr!=null) ? `Serie ${+(el.dataset.sp ?? el.dataset.sr)+1} de ${n}`
        : `Edición de ${n}`;
      snapshot(label, editSnap);
    }
    editSnap = now;
  }
  if(el.dataset.f==='dia'){ render(); toast(`📅 Movido al ${el.value}`, true); }
  if(el.id==='progSel'){ progEx=el.value; render(); }
  if(el.id==='weeksSel'){ state.weeks=+el.value; state.curWeek=Math.min(state.curWeek,state.weeks); save(); render(); }
});
main.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='bwKg') addBody();
  // Enter en una serie: pasa al siguiente campo
  if(e.key==='Enter' && (e.target.dataset.sp!=null || e.target.dataset.sr!=null)){
    e.preventDefault();
    const ins=[...e.target.closest('.excard').querySelectorAll('.setrow input')];
    const nx=ins[ins.indexOf(e.target)+1]; nx ? nx.focus() : e.target.blur();
  }
});
main.addEventListener('click', e=>{
  const b=e.target.closest('[data-action]'); if(!b) return;
  const a=b.dataset.action;
  if(a==='retry'){ enterApp(); return; }
  if(!state) return;
  const card=b.closest('.excard'), cardEx = card ? state.exercises.find(x=>x.id===card.dataset.id) : null, cardW = card ? +card.dataset.wk : 0;
  if(a==='wk-'){ state.curWeek=Math.max(1,state.curWeek-1); save(); render(); }
  else if(a==='wk+'){ state.curWeek=Math.min(state.weeks,state.curWeek+1); save(); render(); }
  else if(a==='go-train'){ entDia=HOY; view='entrenar'; render(); }
  else if(a==='dia'){ entDia=b.dataset.dia; render(); }
  else if(a==='timer'){ startTimer(+b.dataset.sec, b.dataset.name); }
  else if(a==='sel-ex'){ progEx=b.dataset.ex; render(); }
  else if(a==='add-ex'){ openAdd(b.dataset.dia); }
  else if(a==='move'){ openMove(b.dataset.dia); }
  else if(a==='set-done' && cardEx){
    const i=+b.dataset.i, sets=materialize(cardEx,cardW), s=sets[i]; if(!s) return;
    if(!s.d){
      const sg=sugOf(cardEx,cardW,sets,i);
      if(s.p==='' && sg.p) s.p=sg.p;
      if(s.r==='' && sg.r) s.r=sg.r;
      s.d=true;
      summarize(cardEx.id,cardW); save(); render();
      const left=sets.filter(x=>!x.d).length;
      if(left) startTimer(num(cardEx.descanso)||60, `${cardEx.nombre} · faltan ${left}`);
      else toast(`💪 ${cardEx.nombre} completado`);
    } else {
      s.d=false; summarize(cardEx.id,cardW); save(); render();
    }
  }
  else if(a==='set-add' && cardEx){
    const sets=materialize(cardEx,cardW); sets.push({p:'',r:'',d:false});
    summarize(cardEx.id,cardW); save(); render();
  }
  else if(a==='set-del' && cardEx){
    const sets=materialize(cardEx,cardW); if(sets.length<=1) return;
    snapshot(`Quitar serie de ${cardEx.nombre}`);
    sets.pop(); summarize(cardEx.id,cardW); save(); render();
    toast('Serie quitada', true);
  }
  else if(a==='del-ex'){
    const id=b.dataset.idDel, n=exName(id);
    snapshot(`Eliminar ${n}`);
    state.exercises=state.exercises.filter(x=>x.id!==id); delete state.log[id];
    save(); render(); toast(`🗑 ${n} eliminado`, true);
  }
  else if(a==='bw-add') addBody();
  else if(a==='bw-del'){
    snapshot('Eliminar registro de peso corporal');
    state.body=state.body.filter(x=>x.id!==b.dataset.bid); save(); render();
    toast('🗑 Registro eliminado', true);
  }
  else if(a==='export-json'){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download='gymtrack-respaldo.json'; link.click();
  }
  else if(a==='import-json') $('importFile').click();
  else if(a==='reset'){
    if(confirm('¿Borrar todos tus datos y volver a la rutina de ejemplo?')){
      snapshot('Reiniciar todo'); state=defaults(); save(); render();
      toast('Datos reiniciados', true);
    }
  }
});
function addBody(){
  const f=$('bwDate').value, k=num($('bwKg').value);
  if(!f || k==null){ alert('Ingresá una fecha y un peso válido.'); return; }
  snapshot('Agregar peso corporal');
  state.body=state.body.filter(x=>x.fecha!==f); state.body.push({id:uid(),fecha:f,peso:k}); save(); render();
  toast(`✔ ${fmt(k)} kg registrado`, true);
}
$('importFile').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const s=normalize(JSON.parse(rd.result)); if(!s) throw 0;
      snapshot('Importar respaldo'); state=s; save(); render(); toast('✔ Respaldo importado', true); }
    catch(err){ alert('El archivo no es un respaldo válido.'); } };
  rd.readAsText(file); e.target.value='';
});

/* =================== TEMPORIZADOR =================== */
const T={end:0,total:0,int:null,ctx:null};
function startTimer(sec,name){
  try{ T.ctx ??= new (window.AudioContext||window.webkitAudioContext)(); if(T.ctx.state==='suspended') T.ctx.resume(); }catch(e){}
  T.total=sec; T.end=Date.now()+sec*1000;
  $('tName').textContent='Descanso · '+(name||'');
  $('timer').classList.remove('hidden','done');
  clearInterval(T.int); T.int=setInterval(tick,250); tick();
}
function tick(){
  const left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  $('tClock').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  $('tBar').style.width=(T.total?left/T.total*100:0)+'%';
  if(left<=0){
    clearInterval(T.int); T.int=null;
    $('tName').textContent='¡Siguiente serie! 💪';
    $('timer').classList.add('done'); beep();
    if(navigator.vibrate) navigator.vibrate([300,150,300]);
  }
}
function beep(){
  if(!T.ctx) return;
  [0,0.35,0.7].forEach(t=>{ const o=T.ctx.createOscillator(), g=T.ctx.createGain();
    o.frequency.value=880; o.connect(g); g.connect(T.ctx.destination);
    g.gain.setValueAtTime(.25,T.ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,T.ctx.currentTime+t+.25);
    o.start(T.ctx.currentTime+t); o.stop(T.ctx.currentTime+t+.26); });
}
$('tPlus').onclick=()=>{ if(!T.int){ startTimer(15,''); return; } T.end+=15000; T.total+=15; tick(); };
$('tMinus').onclick=()=>{ if(T.int){ T.end-=15000; tick(); } };
$('tStop').onclick=()=>{ clearInterval(T.int); T.int=null; $('timer').classList.add('hidden'); };

/* =================== EXPORTAR EXCEL =================== */
$('xlsBtn').onclick = () => {
  if(!state) return;
  if(!window.XLSX){ alert('No se pudo cargar la librería de Excel. Revisá tu conexión.'); return; }
  const list=sorted(), EXTRA=20, N=list.length+EXTRA, W=state.weeks, C=XLSX.utils.encode_col;
  const wb=XLSX.utils.book_new();
  const cell=(v,f,z)=>{ const o={t:typeof v==='number'?'n':'s',v:v??''}; if(f)o.f=f; if(z)o.z=z; return o; };

  const inst=XLSX.utils.aoa_to_sheet([
    ['GYMTRACK · PLANTILLA DE RUTINA DE GIMNASIO'],[''],['Cómo usarla:'],
    ['1. "Rutina": definí tus ejercicios por día (series, reps, descanso, tempo, RPE, notas).'],
    ['2. "Seguimiento": peso de tu serie más pesada y reps de cada serie por semana. Los nombres se copian solos desde "Rutina".'],
    ['3. "Resumen": se calcula automáticamente el peso inicial, último, máximo y progreso.'],
    ['4. "Detalle por serie": cada serie que registraste en la app con su peso y reps.'],
    ['5. "Peso corporal": registro de tu peso con diferencia automática.'],
    [`6. Tenés ${EXTRA} filas vacías extra en "Rutina" para agregar ejercicios.`],[''],
    ['Glosario:'],['RPE: esfuerzo percibido del 1 al 10 (10 = al fallo).'],
    ['Tempo: excéntrica - pausa - concéntrica en segundos (ej. 3-1-1).'],
    ['1RM estimado: fórmula de Epley = peso × (1 + reps / 30).'],[''],
    ['Generado el', new Date().toLocaleDateString('es')]
  ]);
  inst['!cols']=[{wch:100},{wch:14}];
  XLSX.utils.book_append_sheet(wb,inst,'Instrucciones');

  const rut=[['Día','Grupo muscular','Ejercicio','Series','Reps objetivo','Descanso (seg)','Tempo','RPE objetivo','Notas']];
  list.forEach(e=>rut.push([e.dia,e.grupo,e.nombre,num(e.series)??e.series,e.reps,num(e.descanso)??e.descanso,e.tempo,num(e.rpe)??e.rpe,e.notas]));
  for(let i=0;i<EXTRA;i++) rut.push(Array(9).fill(''));
  const wsR=XLSX.utils.aoa_to_sheet(rut);
  wsR['!cols']=[{wch:12},{wch:16},{wch:30},{wch:8},{wch:13},{wch:14},{wch:9},{wch:12},{wch:34}];
  wsR['!autofilter']={ref:`A1:I${N+1}`};
  XLSX.utils.book_append_sheet(wb,wsR,'Rutina');

  const head=['Día','Ejercicio','Series','Reps obj.'];
  for(let w=1;w<=W;w++) head.push(`S${w} Peso (kg)`,`S${w} Reps`);
  const seg=[head];
  for(let i=0;i<N;i++){ const e=list[i], row=[];
    for(let w=1;w<=W;w++){ if(e){ const l=getLog(e.id,w); row.push(num(l.p)??(l.p||''), num(l.r)!=null&&repsList(l.r).length===1?num(l.r):(l.r||'')); } else row.push('',''); }
    seg.push(['','','','',...row]); }
  const wsS=XLSX.utils.aoa_to_sheet(seg);
  const link=[['A','A'],['B','C'],['C','D'],['D','E']];
  for(let i=0;i<N;i++){ const r=i+2, e=list[i], vals=e?[e.dia,e.nombre,num(e.series)??e.series,e.reps]:['','','',''];
    link.forEach(([dst,src],k)=>{ wsS[`${dst}${r}`]=cell(vals[k],`IF(Rutina!${src}${r}="","",Rutina!${src}${r})`); }); }
  const cols=[{wch:12},{wch:30},{wch:8},{wch:10}]; for(let w=1;w<=W;w++) cols.push({wch:13},{wch:12});
  wsS['!cols']=cols;
  XLSX.utils.book_append_sheet(wb,wsS,'Seguimiento');

  const pesoCols=[]; for(let w=0;w<W;w++) pesoCols.push(C(4+w*2));
  const wsRes=XLSX.utils.aoa_to_sheet([['Día','Ejercicio','Peso inicial (kg)','Último peso (kg)','Peso máximo (kg)','Progreso (kg)','Progreso (%)','Semanas registradas','Mejor 1RM est. (kg)']]);
  for(let i=0;i<N;i++){
    const r=i+2, e=list[i], refs=pesoCols.map(c=>`Seguimiento!${c}${r}`);
    const vals=e?weightsOf(e.id).filter(v=>v!=null):[];
    const ini=vals[0]??'', ult=vals.length?vals[vals.length-1]:'', mx=vals.length?Math.max(...vals):'';
    const dif=(ini!==''&&ult!=='')?ult-ini:'', pct=(dif!==''&&ini)?dif/ini:'';
    let lastF='""'; refs.forEach(x=>{ lastF=`IF(ISNUMBER(${x}),${x},${lastF})`; });
    let firstF='""'; [...refs].reverse().forEach(x=>{ firstF=`IF(ISNUMBER(${x}),${x},${firstF})`; });
    wsRes[`A${r}`]=cell(e?e.dia:'',`Seguimiento!A${r}&""`);
    wsRes[`B${r}`]=cell(e?e.nombre:'',`Seguimiento!B${r}&""`);
    wsRes[`C${r}`]=cell(ini,firstF,'0.0');
    wsRes[`D${r}`]=cell(ult,lastF,'0.0');
    wsRes[`E${r}`]=cell(mx,`IF(COUNT(${refs.join(',')})=0,"",MAX(${refs.join(',')}))`,'0.0');
    wsRes[`F${r}`]=cell(dif,`IF(OR(C${r}="",D${r}=""),"",D${r}-C${r})`,'+0.0;-0.0;0');
    wsRes[`G${r}`]=cell(pct,`IF(OR(C${r}="",D${r}="",C${r}=0),"",(D${r}-C${r})/C${r})`,'+0.0%;-0.0%;0%');
    wsRes[`H${r}`]={t:'n',v:vals.length,f:`COUNT(${refs.join(',')})`};
    const rm=e?bestRM(e.id):null; wsRes[`I${r}`]=cell(rm!=null?Math.round(rm*10)/10:'',null,'0.0');
  }
  wsRes['!ref']=`A1:I${N+1}`;
  wsRes['!cols']=[{wch:12},{wch:30},{wch:16},{wch:16},{wch:16},{wch:14},{wch:13},{wch:20},{wch:20}];
  XLSX.utils.book_append_sheet(wb,wsRes,'Resumen');

  const det=[['Semana','Día','Ejercicio','Serie','Peso (kg)','Reps','Hecha']];
  for(let w=1;w<=W;w++) list.forEach(e=>{
    const l=getLog(e.id,w); if(!Array.isArray(l.s)) return;
    l.s.forEach((s,i)=>{ if(s.p==='' && s.r==='' && !s.d) return;
      det.push([w,e.dia,e.nombre,i+1,num(s.p)??s.p,num(s.r)??s.r,s.d?'✔':'']); });
  });
  const wsD=XLSX.utils.aoa_to_sheet(det);
  wsD['!cols']=[{wch:9},{wch:12},{wch:30},{wch:7},{wch:11},{wch:8},{wch:8}];
  wsD['!autofilter']={ref:`A1:G${det.length}`};
  XLSX.utils.book_append_sheet(wb,wsD,'Detalle por serie');

  const bs=bodySorted(), BN=bs.length+30;
  const wsB=XLSX.utils.aoa_to_sheet([['Fecha','Peso (kg)','Cambio (kg)']]);
  for(let i=0;i<BN;i++){ const r=i+2, b=bs[i];
    wsB[`A${r}`]=b?{t:'d',v:new Date(b.fecha+'T12:00'),z:'dd/mm/yyyy'}:cell('');
    wsB[`B${r}`]=b?cell(b.peso,null,'0.0'):cell('');
    wsB[`C${r}`]=r===2?cell('—'):cell(b&&bs[i-1]?b.peso-bs[i-1].peso:'',`IF(OR(B${r}="",B${r-1}=""),"",B${r}-B${r-1})`,'+0.0;-0.0;0');
  }
  wsB['!ref']=`A1:C${BN+1}`; wsB['!cols']=[{wch:14},{wch:12},{wch:12}];
  XLSX.utils.book_append_sheet(wb,wsB,'Peso corporal');

  XLSX.writeFile(wb,'gymtrack-rutina.xlsx');
};

/* =================== INICIO =================== */
(async function boot(){
  renderNav(); setHeader(); updateUndo();
  if(!CLOUD){
    state = loadLocal(KEY) || loadLocal('rutina-gym-v1') || defaults();
    setSync('local'); render(); return;
  }
  try{
    const h = await handleHash();
    if(h && h.err){ showAuth(tr(h.err),'err'); return; }
    if(h && h.type==='recovery'){
      const np = prompt('Escribí tu nueva contraseña (mínimo 6 caracteres):');
      if(np && np.length>=6){
        const r = await fetch(`${API}/auth/v1/user`,{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify({password:np})});
        alert(r.ok ? 'Contraseña actualizada ✔' : 'No se pudo cambiar la contraseña.');
      }
    }
  }catch(e){}
  if(session) enterApp(); else showAuth();
})();
